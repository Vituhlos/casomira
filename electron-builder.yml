# Balení Verdictu pro Windows (NSIS) a macOS (DMG). Viz docs/dev/BUILD.md.
# Release na GitHub řeší .github/workflows/release.yml (ne auto-publish z tagu).
publish: null

appId: cz.verdict.app
productName: Verdict
copyright: Copyright © Verdict

directories:
  output: release
  buildResources: build

# macOS 26: Helpers přejmenované bez patch Electron binárky → SIGTRAP (#9771)
afterPack: scripts/afterPack-mac-helpers.cjs

files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/**'
  - '!reference/**'
  - '!release/**'
  - '!*.md'
  - '!*.tsbuildinfo'
  - '!{.env,.env.*}'

# PNG ikona přístupná za běhu pro BrowserWindow.icon (dev i prod, Windows/Linux).
# Instalační ikony berou platformní formáty níže: .ico pro Windows, .icns pro macOS.
extraResources:
  - from: build/icon.png
    to: icon.png

# node:sqlite je vestavěný v Node.js — žádný nativní modul k rozbalení.
npmRebuild: false

win:
  target:
    - nsis
  executableName: Verdict
  artifactName: Verdict-Setup-${version}.${ext}
  # Ikona appky. .ico obsahuje multi-rozlišení 16/24/32/48/64/128/256 px.
  # rcedit ji embedne do Verdict.exe (= ikona v Průzkumníku i v taskbaru).
  # POZOR: signAndEditExecutable nesmí být false — to by zakázalo i embedding ikony.
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Verdict
  uninstallDisplayName: Verdict
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

mac:
  # Jeden DMG pro Intel (x64) i Apple Silicon (arm64).
  target:
    - target: dmg
      arch: universal
  category: public.app-category.sports
  artifactName: Verdict-${version}-mac-universal.${ext}
  # Ad-hoc podpis (bez Apple Developer účtu). Povinné s hardenedRuntime — jinak
  # se entitlements.plist do .app neaplikují a V8/JIT nestartuje.
  # CSC_IDENTITY_AUTO_DISCOVERY=false v CI samo o sobě podpis vypne.
  identity: '-'
  # Hardened runtime: nutné pro V8 JIT (allow-jit + allow-unsigned-executable-memory).
  # disable-library-validation NUTNÉ i bez nativních .node modulů — bez něj electron-builder
  # 26.0.13+ aplikuje ad-hoc podpis s hardenedRuntime a Electron Framework dostane jiné
  # Team ID než hlavní binárka → DYLD crash "different Team IDs" na macOS 26 (#9529, #9396).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Test build nemá Apple notarizaci — nepouštěj Gatekeeper assess při buildu.
  gatekeeperAssess: false
  # Ikona .app — nativní macOS .icns s velikostmi 16–1024 vč. @2x.
  icon: build/icon.icns

dmg:
  title: Verdict ${version}
  # icon: build/dmg-icon.icns

linux:
  target: []
