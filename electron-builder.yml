# Balení Časomíry pro Windows (NSIS) a macOS (DMG). Viz docs/dev/BUILD.md.
# Release na GitHub řeší .github/workflows/release.yml (ne auto-publish z tagu).
publish: null

appId: cz.casomira.app
productName: Časomíra
copyright: Copyright © Časomíra

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/**'
  - '!reference/**'
  - '!release/**'
  - '!*.md'
  - '!*.tsbuildinfo'
  - '!{.env,.env.*}'

# Ikona přístupná za běhu pro BrowserWindow.icon (dev i prod, Windows i Linux).
# macOS nepotřebuje — ikona jde z .app bundle.
extraResources:
  - from: build/icon.png
    to: icon.png

# Nativní SQLite — nesmí být uvnitř asar (CLAUDE.md + electron-vite guide).
asarUnpack:
  - node_modules/better-sqlite3/**

# Přebuildovat native moduly jen když ještě nejsou pro Electron (viz `npm run rebuild`).
# Při EPERM zavři běžící Časomíru / `npm run dev` a spusť znovu, nebo: npm run rebuild && npm run dist:win
npmRebuild: false

win:
  target:
    - nsis
  executableName: Casomira
  artifactName: Casomira-Setup-${version}.${ext}
  # Ikona appky. electron-builder z PNG (1024×1024) vyrobí multi-velikostní .ico
  # a přes rcedit ho embedne do Casomira.exe (= ikona v Průzkumníku i v taskbaru).
  # Platí i pro NSIS instalátor. Bez certifikátu signing electron-builder přeskočí.
  # POZOR: signAndEditExecutable nesmí být false — to by zakázalo i embedding ikony.
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Časomíra
  uninstallDisplayName: Časomíra
  # Volitelně: build/icon.ico (512×512 zdroj → viz docs/dev/BUILD.md)
  # installerIcon: build/icon.ico
  # uninstallerIcon: build/icon.ico

mac:
  # Jeden DMG pro Intel (x64) i Apple Silicon (arm64).
  target:
    - target: dmg
      arch: universal
  category: public.app-category.sports
  artifactName: Casomira-${version}-mac-universal.${ext}
  # Nativní moduly (better-sqlite3) v asarUnpack — pro universal obě architektury.
  mergeASARs: true
  # Ad-hoc podpis (bez Apple Developer účtu). Povinné s hardenedRuntime — jinak
  # entitlements.plist se do .app neaplikují a better-sqlite3 padá SIGTRAP při startu.
  # CSC_IDENTITY_AUTO_DISCOVERY=false v CI samo o sobě podpis vypne.
  identity: '-'
  # Hardened runtime + oprávnění: bez `disable-library-validation` macOS odmítne
  # načíst nativní modul better-sqlite3 a appka spadne hned po startu (SIGTRAP).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Test build nemá Apple notarizaci — nepouštěj Gatekeeper assess při buildu.
  gatekeeperAssess: false
  # Ikona .app — electron-builder z build/icon.png vyrobí .icns (vč. retina @2x).
  icon: build/icon.png

dmg:
  title: Časomíra ${version}
  # icon: build/dmg-icon.icns

linux:
  target: []
