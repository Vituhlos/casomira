# Balení Časomíry pro Windows (NSIS) a macOS (DMG). Viz BUILD.md.
# Release na GitHub řeší .github/workflows/release.yml (ne auto-publish z tagu).
publish: null

appId: cz.casomira.app
productName: Časomíra
copyright: Copyright © Časomíra

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/**'
  - '!Casomira-macOS/**'
  - '!release/**'
  - '!*.md'
  - '!*.tsbuildinfo'
  - '!{.env,.env.*}'

# Nativní SQLite — nesmí být uvnitř asar (CLAUDE.md + electron-vite guide).
asarUnpack:
  - node_modules/better-sqlite3/**

# Přebuildovat native moduly jen když ještě nejsou pro Electron (viz `npm run rebuild`).
# Při EPERM zavři běžící Časomíru / `npm run dev` a spusť znovu, nebo: npm run rebuild && npm run dist:win
npmRebuild: false

win:
  target:
    - nsis
  executableName: Casomira
  artifactName: Casomira-Setup-${version}.${ext}
  # Ikona appky. electron-builder z jednoho PNG (1024×1024, průhledné pozadí) sám
  # vyrobí multi-velikostní .ico — embedne ho do .exe (= i ikona okna a v liště)
  # i do instalátoru. Žádný extra nástroj → funguje i na CI runneru.
  icon: build/icon.png
  # Bez podpisu kódu (vyhne se chybě symlinků winCodeSign na Windows bez dev režimu).
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Časomíra
  uninstallDisplayName: Časomíra
  # Volitelně: build/icon.ico (512×512 zdroj → viz BUILD.md)
  # installerIcon: build/icon.ico
  # uninstallerIcon: build/icon.ico

mac:
  # Jeden DMG pro Intel (x64) i Apple Silicon (arm64).
  target:
    - target: dmg
      arch: universal
  category: public.app-category.sports
  artifactName: Casomira-${version}-mac-universal.${ext}
  # Nativní moduly (better-sqlite3) v asarUnpack — pro universal obě architektury.
  mergeASARs: true
  # Hardened runtime + oprávnění: bez `disable-library-validation` macOS odmítne
  # načíst nativní modul better-sqlite3 a appka spadne hned po startu (SIGTRAP).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Test build nemá Apple notarizaci — nepouštěj Gatekeeper assess při buildu.
  gatekeeperAssess: false
  # Ikona .app — electron-builder z build/icon.png vyrobí .icns (vč. retina @2x).
  icon: build/icon.png

dmg:
  title: Časomíra ${version}
  # icon: build/dmg-icon.icns

linux:
  target: []
