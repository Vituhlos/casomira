name: CI

on:
  push:
    branches:
      - heroui-native
  pull_request:
    branches:
      - master
      - heroui-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, testy a build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript kontrola
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Build
        run: npm run build
