name: macOS Debug 2

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build app
        run: npm run dist:mac

      - name: Find app
        run: |
          echo "=== APPS ==="
          find release -name "*.app"

      - name: Inspect better-sqlite3
        run: |
          echo "=== better-sqlite3 ==="
          find release -name "*better*" || true
          find release -name "*.node" || true

      - name: Check sqlite binary architecture
        run: |
          SQLITE=$(find release -name "better_sqlite3.node" | head -n 1)

          echo "=== SQLITE FILE ==="
          echo "$SQLITE"

          echo "=== FILE INFO ==="
          file "$SQLITE" || true

          echo "=== LIPO INFO ==="
          lipo -info "$SQLITE" || true

      - name: Launch app
        continue-on-error: true
        run: |
          APP=$(find release -name "*.app" | head -n 1)

          echo "Launching: $APP"

          export ELECTRON_ENABLE_LOGGING=1
          export ELECTRON_ENABLE_STACK_DUMPING=1

          "$APP/Contents/MacOS/Časomíra" &

          PID=$!

          echo "PID=$PID"

          sleep 15

          echo "=== PROCESS STATUS ==="
          ps -p $PID || true

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts

          echo "=== DiagnosticReports ==="
          ls -lah ~/Library/Logs/DiagnosticReports || true

          echo "=== Application Support ==="
          ls -lah "$HOME/Library/Application Support" || true

          cp -R ~/Library/Logs/DiagnosticReports artifacts/diagnostics 2>/dev/null || true

          cp -R "$HOME/Library/Application Support/casomira" artifacts/casomira 2>/dev/null || true

          echo "=== Collected files ==="
          find artifacts -type f || true

      - name: Show startup log
        if: always()
        run: |
          echo "=== STARTUP LOG ==="

          cat "$HOME/Library/Application Support/casomira/startup.log" || true

      - name: Show main log
        if: always()
        run: |
          echo "=== MAIN LOG ==="
          cat /tmp/casomira-main.log || true
      
      - name: Show database files
        if: always()
        run: |
          echo "=== CASOMIRA FILES ==="

          find "$HOME/Library/Application Support/casomira" -type f || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-debug-artifacts
          path: artifacts
          if-no-files-found: warn
