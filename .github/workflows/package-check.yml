# Ruční sestavení instalátorů (Windows NSIS + macOS DMG) bez vydání Release.
# Výstup se nahraje jako Actions artifact (14 dní). Nic se netaguje ani nepublikuje.
#
# Spuštění: Actions → Package check → Run workflow
name: Package check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_label: Windows
            dist_cmd: dist:win
            artifact_name: Verdict-package-windows
            artifact_path: release/Verdict-Setup-*.exe
          - os: macos-latest
            os_label: macOS
            dist_cmd: dist:mac
            artifact_name: Verdict-package-macos
            artifact_path: release/Verdict-*-mac-universal.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript kontrola
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Build installer
        run: npm run ${{ matrix.dist_cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Seznam výstupu
        shell: bash
        run: ls -la release/ || true

      - name: Nahraj artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14
          if-no-files-found: error
