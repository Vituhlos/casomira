# Sestavení instalátorů Windows (NSIS) + macOS (DMG) a nahrání do GitHub Release.
# Soubory se nahrávají přímo do Release — nepoužívá actions/upload-artifact
# (vyhneme se artifact storage quotě).
#
# Spuštění:
#   git tag v0.9.0 && git push origin v0.9.0
# nebo ručně: Actions → Release → Run workflow
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag pro GitHub Release (např. v0.9.0)'
        required: true
        default: v0.9.0

permissions:
  contents: write

jobs:
  # Vytvoří (nebo aktualizuje) draft Release s popisem z CHANGELOG.md.
  # Musí proběhnout dřív než build joby nahrávají soubory.
  create-release:
    name: Vytvoř GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zjisti tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Ověř verzi a changelog
        run: node scripts/check-release.mjs "${{ steps.tag.outputs.value }}"

      - name: Sestav poznámky k Release
        run: node scripts/release-notes.mjs "${{ steps.tag.outputs.value }}" > RELEASE_NOTES.md

      - name: Vytvoř nebo aktualizuj draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Verdict ${{ steps.tag.outputs.value }}
          draft: true
          prerelease: ${{ contains(steps.tag.outputs.value, '-') }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.os_label }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_label: Windows
            dist_cmd: dist:win
            artifact_glob: release/Verdict-Setup-*.exe
          - os: macos-latest
            os_label: macOS
            dist_cmd: dist:mac
            artifact_glob: release/Verdict-*-mac-universal.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # node:sqlite je vestavěný v Node.js — žádný nativní modul k rebuildování.

      - name: TypeScript kontrola
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Build installer
        run: npm run ${{ matrix.dist_cmd }}
        env:
          # CI nemá Apple certifikát — DMG bez podpisu (pro závod / test OK).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List release output
        shell: bash
        run: ls -la release/ || true

      # Nahraj přímo do GitHub Release — bez artifact storage.
      - name: Nahraj do GitHub Release
        shell: bash
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" ${{ matrix.artifact_glob }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Jakmile jsou oba buildy hotové, zveřejni Release (draft → publish).
  publish:
    name: Zveřejni Release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publikuj Release
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
