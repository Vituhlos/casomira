# Sestavení instalátorů Windows (NSIS) + macOS (DMG) a nahrání do GitHub Release.
#
# Spuštění:
#   git tag v0.9.0 && git push origin v0.9.0
# nebo ručně: Actions → Release → Run workflow
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag pro GitHub Release (např. v0.9.0)'
        required: true
        default: v0.9.0

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_label: Windows
            dist_cmd: dist:win
            artifact_glob: release/Casomira-Setup-*.exe
          - os: macos-latest
            os_label: macOS
            dist_cmd: dist:mac
            artifact_glob: release/Casomira-*-mac-universal.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # node:sqlite je vestavěný v Node.js — žádný nativní modul k rebuildování.

      - name: Build installer
        run: npm run ${{ matrix.dist_cmd }}
        env:
          # CI nemá Apple certifikát — DMG bez podpisu (pro závod / test OK).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List release output
        shell: bash
        run: ls -la release/ || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os_label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      # Checkout kvůli CHANGELOG.md a skriptu pro poznámky (musí být PŘED stažením
      # artefaktů, ať nepřepíše složku artifacts/).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      # Popis Release = sekce z CHANGELOG.md pro daný tag + instalační poznámka.
      - name: Sestav poznámky k Release
        run: node scripts/release-notes.mjs "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}" > RELEASE_NOTES.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Časomíra ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
