<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Časomíra — koncepty loga</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; }
  .logoboard {
    box-sizing: border-box; width: 100%; height: 100%;
    background: #ffffff; display: flex; flex-direction: column;
    align-items: center; gap: 20px; padding: 24px 20px;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .tile-row { display: flex; gap: 16px; align-items: center; }
  .ramp-row { display: flex; gap: 14px; align-items: flex-end; }
  .titlebar {
    display: flex; align-items: center; gap: 8px;
    background: #f4f4f5; border: 1px solid #e4e4e7; border-radius: 8px;
    padding: 8px 12px; width: 250px; box-sizing: border-box;
  }
  .titlebar-name { font-size: 13px; font-weight: 600; color: #27272a; }
  .titlebar-ver { font-size: 11px; color: #a1a1aa; margin-left: auto; }
  .lights { display: flex; gap: 5px; margin-right: 4px; }
  .lights span { width: 9px; height: 9px; border-radius: 999px; display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

const BLUE = "#006FEE";
const DARK = "#18181b";

// ---- Glyphs (viewBox 0 0 100 100). fg = main color, ac = accent ----
function GlyphStopky({ fg, ac }) {
  return (
    <g fill="none" strokeLinecap="round">
      <rect x="42" y="8" width="16" height="9" rx="4" fill={fg} stroke="none"></rect>
      <circle cx="50" cy="58" r="29" stroke={fg} strokeWidth="9"></circle>
      <line x1="50" y1="58" x2="50" y2="38" stroke={ac} strokeWidth="9"></line>
    </g>
  );
}
function GlyphMonogram({ fg, ac }) {
  return (
    <g fill="none" strokeLinecap="round">
      <path d="M 71 45 A 26 26 0 1 0 71 79" stroke={fg} strokeWidth="11"></path>
      <polyline points="37,11 50,23 63,11" stroke={ac} strokeWidth="10" strokeLinejoin="round" fill="none"></polyline>
    </g>
  );
}
function GlyphPaprsek({ fg, ac }) {
  return (
    <g fill="none" strokeLinecap="round">
      <line x1="68" y1="18" x2="68" y2="82" stroke={fg} strokeWidth="10"></line>
      <circle cx="40" cy="50" r="14" fill={ac}></circle>
    </g>
  );
}
function GlyphSektory({ fg, ac }) {
  return (
    <g fill="none" strokeLinecap="round">
      <path d="M 27 34.7 A 30 30 0 0 1 73 34.7" stroke={ac} strokeWidth="9"></path>
      <path d="M 78.2 43.7 A 30 30 0 0 1 55.2 83.5" stroke={fg} strokeWidth="9"></path>
      <path d="M 44.8 83.5 A 30 30 0 0 1 21.8 43.7" stroke={fg} strokeWidth="9"></path>
      <circle cx="50" cy="54" r="6" fill={fg}></circle>
    </g>
  );
}
function GlyphSachovnice({ fg, ac }) {
  return (
    <g>
      <rect x="25" y="25" width="22" height="22" rx="5" fill={fg}></rect>
      <rect x="53" y="25" width="22" height="22" rx="5" fill={ac}></rect>
      <rect x="25" y="53" width="22" height="22" rx="5" fill={ac}></rect>
      <rect x="53" y="53" width="22" height="22" rx="5" fill={fg}></rect>
    </g>
  );
}
function GlyphHacek({ fg, ac }) {
  return (
    <g fill="none">
      <polyline points="28,28 50,50 72,28" stroke={fg} strokeWidth="12" strokeLinecap="round" strokeLinejoin="round"></polyline>
      <circle cx="50" cy="73" r="8.5" fill={ac}></circle>
    </g>
  );
}

// ---- Tile = squircle app icon ----
function Tile({ Glyph, size, mode }) {
  const dark = mode === "dark";
  const bg = dark ? DARK : "#ffffff";
  const fg = dark ? "#ffffff" : DARK;
  return (
    <div style={{
      width: size, height: size, borderRadius: size * 0.225,
      background: bg, flexShrink: 0,
      border: dark ? "none" : "1px solid #e4e4e7",
      boxShadow: "0 1px 3px rgba(0,0,0,0.10)",
      display: "flex", alignItems: "center", justifyContent: "center",
      boxSizing: "border-box"
    }}>
      <svg width={size * 0.72} height={size * 0.72} viewBox="0 0 100 100">
        <Glyph fg={fg} ac={BLUE} />
      </svg>
    </div>
  );
}

function Lockup({ Glyph }) {
  return (
    <div className="titlebar">
      <div className="lights">
        <span style={{ background: "#fb5f57" }}></span>
        <span style={{ background: "#fdbc2e" }}></span>
        <span style={{ background: "#28c840" }}></span>
      </div>
      <Tile Glyph={Glyph} size={18} mode="dark" />
      <span className="titlebar-name">Časomíra</span>
      <span className="titlebar-ver">v0.9.11</span>
    </div>
  );
}

function Board({ Glyph }) {
  return (
    <div className="logoboard">
      <div className="tile-row">
        <Tile Glyph={Glyph} size={132} mode="dark" />
        <Tile Glyph={Glyph} size={132} mode="light" />
      </div>
      <div className="ramp-row">
        <Tile Glyph={Glyph} size={64} mode="dark" />
        <Tile Glyph={Glyph} size={32} mode="dark" />
        <Tile Glyph={Glyph} size={16} mode="dark" />
        <Tile Glyph={Glyph} size={32} mode="light" />
        <Tile Glyph={Glyph} size={16} mode="light" />
      </div>
      <Lockup Glyph={Glyph} />
    </div>
  );
}

const BW = 330, BH = 320;

function App() {
  return (
    <DesignCanvas>

      <DCSection id="koncepty" title="Koncepty ikony" subtitle="Tmavá + světlá dlaždice · zmenšeniny 64 / 32 / 16 px · logotyp v title baru">
        <DCArtboard id="v1" label="1 · Stopky — minimální ciferník" width={BW} height={BH}>
          <Board Glyph={GlyphStopky} />
        </DCArtboard>
        <DCArtboard id="v2" label="2 · Monogram Č — háček jako akcent ★" width={BW} height={BH}>
          <Board Glyph={GlyphMonogram} />
        </DCArtboard>
        <DCArtboard id="v3" label="3 · Časový paprsek — okamžik průjezdu" width={BW} height={BH}>
          <Board Glyph={GlyphPaprsek} />
        </DCArtboard>
        <DCArtboard id="v4" label="4 · Sektory — ciferník ze tří úseků" width={BW} height={BH}>
          <Board Glyph={GlyphSektory} />
        </DCArtboard>
        <DCArtboard id="v5" label="5 · Cílová šachovnice — 2×2 minimum" width={BW} height={BH}>
          <Board Glyph={GlyphSachovnice} />
        </DCArtboard>
        <DCArtboard id="v6" label="6 · Háček + bod — abstraktní značka" width={BW} height={BH}>
          <Board Glyph={GlyphHacek} />
        </DCArtboard>
      </DCSection>

      <DCSection id="pozn" title="Doporučení">
        <DCPostIt>
          ★ Doporučuji koncept 2 (Monogram Č): je vlastnitelný — háček je
          česká stopa, kterou Linear/Raycast-style ikony nemají. Čte se i
          v 16 px a modrý akcent ladí s HeroUI primary. Koncept 1 je
          bezpečná klasika, ale splývá s generickými timer appkami.
          Koncept 6 je nejodvážnější — funguje spíš jako značka než ikona.
        </DCPostIt>
        <DCPostIt>
          Šachovnici (5) berte jako hraniční variantu — i v minimální
          podobě je to závodní klišé. Pokud se líbí směr, dá se použít
          jen jako drobný interní motiv (např. stav „dokončeno“), ne
          jako hlavní ikona.
        </DCPostIt>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
